```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm trung bình sinh viên</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>TÍNH ĐIỂM TRUNG BÌNH SINH VIÊN</h1>

        <form id="studentForm">

            <div class="form-group">
                <label for="studentName">Tên sinh viên:</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Nhập tên sinh viên"
                >
            </div>

            <div class="form-group">
                <label for="giaiTich">Giải tích 1:</label>
                <input
                    type="number"
                    id="giaiTich"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <div class="form-group">
                <label for="daiSo">Đại số tuyến tính:</label>
                <input
                    type="number"
                    id="daiSo"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <div class="form-group">
                <label for="xacSuat">Xác suất thống kê:</label>
                <input
                    type="number"
                    id="xacSuat"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <div class="form-group">
                <label for="tinHoc">Tin học đại cương:</label>
                <input
                    type="number"
                    id="tinHoc"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <div class="form-group">
                <label for="web">Xây dựng ứng dụng Web:</label>
                <input
                    type="number"
                    id="web"
                    min="0"
                    max="10"
                    step="0.01"
                    placeholder="0 - 10"
                >
            </div>

            <p id="errorMessage"></p>

            <button type="submit">Tính kết quả</button>
        </form>

        <div id="result" class="result hidden">
            <h2>KẾT QUẢ HỌC TẬP</h2>

            <p>
                <strong>Tên sinh viên:</strong>
                <span id="resultName"></span>
            </p>

            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Môn học</th>
                        <th>Điểm</th>
                    </tr>
                </thead>

                <tbody id="resultTable">
                </tbody>
            </table>

            <div class="summary">
                <p>
                    <strong>Điểm trung bình:</strong>
                    <span id="average"></span>
                </p>

                <p>
                    <strong>Xếp loại:</strong>
                    <span id="classification"></span>
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
```
